name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==1.26.4 scipy==1.13.1 matplotlib==3.9.2
      - run: python3 tools/verify_results.py
